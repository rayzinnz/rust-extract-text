[package]
name = "extract_text"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
calamine = { git = "https://github.com/rayzinnz/calamine.git" }
cfb = "0.x"
crc-fast = "1"
encoding_rs = "0.x"
encoding_rs_io = "0.x"
helper_lib = { git = "https://github.com/rayzinnz/rust-helper-lib.git" }
log = "0.x"
mail-parser = "0.x"
openssl = { version = "0.10", features = ["vendored"] }
quick-xml = "0.x"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = { version = "0.x", features = ["aes256"] }
simplelog = "^0.12.0"
time = "0.x"
tokio = { version = "1", features = ["full"] }
uuid = {version = "1", features = ["v4"]}
walkdir = "2"
zip = "8"
